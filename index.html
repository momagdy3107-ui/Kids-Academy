<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أكاديمية الأطفال - الصفحة الرئيسية</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="images/favicon.ico">
</head>
<body>
    <div class="container">
        <h1>🌟 عالم المتعة والتعلم 🌟</h1>
        <p class="subtitle">اختر المادة اللي تحب تبدأ بيها رحلتك النهاردة</p>
        
        <div class="subjects-grid">
            <div class="card arabic" onclick="openSubject('arabic')">
                <span class="icon">📚</span>
                <h2>اللغة العربية</h2>
                <p>قصص وحكايات ممتعة</p>
            </div>
            <div class="card english" onclick="openSubject('english')">
                <span class="icon">🔤</span>
                <h2>اللغة الإنجليزية</h2>
                <p>كلمات وحروف جديدة</p>
            </div>
            <div class="card math" onclick="openSubject('math')">
                <span class="icon">🔢</span>
                <h2>الرياضيات</h2>
                <p>الأرقام والألغاز الحسابية</p>
            </div>
            <div class="card science" onclick="openSubject('science')">
                <span class="icon">🧪</span>
                <h2>العلوم</h2>
                <p>اكتشافات وتجارب مذهلة</p>
            </div>
            <div class="card geography" onclick="openSubject('geography')">
                <span class="icon">🌍</span>
                <h2>الجغرافيا</h2>
                <p>رحلة حول العالم</p>
            </div>
            <div class="card space" onclick="openSubject('space')">
                <span class="icon">🚀</span>
                <h2>الفضاء</h2>
                <p>النجوم والكواكب البعيدة</p>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
